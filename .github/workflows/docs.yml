name: Docs on main
run-name: build-docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/source/**'
      - 'docs/zensical.toml'

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build documentation
      run: make docs/build
    - uses: actions/upload-artifact@v4
      with:
        name: betwixt-site
        path: docs/site
        retention-days: 14

  deploy:
    needs: docs-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download docs-gated site
      uses: actions/download-artifact@v4
      with:
        name: betwixt-site
        path: docs/site
    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/site
